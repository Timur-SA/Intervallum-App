services:
  intervallum-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CORE_API_URL: ${VITE_CORE_API_URL:-http://127.0.0.1:8000}
    container_name: intervallum-app
    restart: unless-stopped
    ports:
      # Bind to localhost only so host Caddy can reverse proxy with SSL
      - "127.0.0.1:${APP_PORT:-3000}:80"
