services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_CORE_API_URL: ${VITE_CORE_API_URL:-http://127.0.0.1:8000}
    command: sh -c "[ -d node_modules/vite ] || npm ci --prefer-offline --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  node_modules:
